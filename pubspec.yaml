name: metroplayer
description: Offline music player with a Zune-inspired Metro UI.
publish_to: 'none'
version: 0.1.0-beta+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: '>=14.0.0 <18.0.0'
  just_audio: '>=0.9.40 <0.10.0'
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  permission_handler: ^11.3.1
  file_picker: '>=8.0.0 <11.0.0'
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10
  audio_metadata_reader: ^1.4.1
  image: ^4.2.0
  crypto: ^3.0.5
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  material_ui: ^1.11.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerif-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/NotoSerif-SemiBold.ttf
          weight: 600
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
